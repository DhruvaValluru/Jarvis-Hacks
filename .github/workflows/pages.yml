# Publishes Alfred's web demo (demo/: the app's UI on a simulated PC, in the browser) to GitHub Pages:
# https://dhruvavalluru.github.io/Jarvis-Hacks/
# `python3 demo/build.py` writes the static site to demo/dist/site/. This job puts that folder on the gh-pages
# branch as one fresh commit (force-pushed, with .nojekyll so Pages serves the files as they are), using only git
# and the workflow's own token. A commit without demo/build.py has no demo yet: the run warns, publishes nothing
# and stays green. Going live, in this order (docs/TASKS.md, K14):
#   1. demo/ is on main, so this runs and fills the gh-pages branch.
#   2. Once, the repository owner chooses Settings > Pages > "Deploy from a branch" > gh-pages / (root).
#      The last step checks that.
#   3. Open the address above and check that the demo loads. Only then link it from the README.
#   4. Cut the release (windows-mvp/INSTALL.md, "Download a release"), so its notes link to the demo.
name: pages
on:
  push:
    branches: [main]
    paths: ["demo/**", "windows-mvp/jarvis/app/ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write  # push the gh-pages branch
  pages: read  # check how Pages is set up
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web demo
        id: build
        run: |
          if [ ! -f demo/build.py ]; then
            # Not an error: the workflow can reach main before the demo does.
            echo "::warning::There is no demo/build.py in this commit, so there is no web demo to publish yet. Nothing was deployed."
            echo "No web demo in this commit yet (demo/build.py is missing). Nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 demo/build.py
          if [ ! -f demo/dist/site/index.html ]; then
            echo "::error::demo/build.py ran but demo/dist/site/index.html is missing. Nothing was deployed."
            exit 1
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Publish to the gh-pages branch
        if: steps.build.outputs.built == 'true'
        run: |
          site=demo/dist/site
          touch "$site/.nojekyll"
          # A separate index, so the commit holds exactly the site's files and nothing from main.
          export GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          git --work-tree="$site" add --all --force
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # No parent: the branch only ever has the latest site, so it never grows.
          commit=$(git commit-tree "$tree" -m "Web demo built from $GITHUB_SHA")
          git push --force origin "$commit:refs/heads/gh-pages"
          echo "Pushed $(git ls-tree -r --name-only "$commit" | wc -l) files to gh-pages ($commit)."
      - name: Check that Pages serves the gh-pages branch
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fix='Settings > Pages > Build and deployment > Source: "Deploy from a branch", Branch: gh-pages / (root), Save.'
          if ! pages=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2> "$RUNNER_TEMP/pages.err"); then
            if grep -q "HTTP 404" "$RUNNER_TEMP/pages.err"; then
              echo "::warning::GitHub Pages isn't turned on for this repository yet, so the demo isn't online. Once, the repository owner: $fix"
            else
              echo "::warning::Couldn't check how GitHub Pages is set up ($(head -n 1 "$RUNNER_TEMP/pages.err")). If the demo isn't online: $fix"
            fi
            echo "The demo is on the gh-pages branch. If it isn't online: $fix" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          build=$(jq -r '.build_type // ""' <<< "$pages")
          branch=$(jq -r '.source.branch // ""' <<< "$pages")
          path=$(jq -r '.source.path // ""' <<< "$pages")
          url=$(jq -r '.html_url // ""' <<< "$pages")
          if [ "$build" = workflow ] || [ "$branch" != gh-pages ] || [ "$path" != / ]; then
            echo "::warning::GitHub Pages is set up to serve something other than the gh-pages branch, so this deploy won't show. $fix"
            echo "Pages doesn't serve gh-pages / (root) yet. $fix" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Web demo: $url (Pages takes a minute or two to update)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
