# Builds Alfred's Windows installer and checks it works (see windows-mvp/INSTALL.md):
# PyInstaller app folder + Node + Telegram bridge, self-test, Inno Setup installer, silent install into a
# temporary folder, self-test of the installed copy, silent uninstall. The installer is uploaded as the
# "Alfred-Setup" artifact on the run's page. It is not code-signed (SmartScreen says "unknown publisher").
# Run it by hand with "release" ticked (Actions > alfred-desktop > Run workflow) and the "release" job also
# publishes that installer as the public GitHub release v<version> (windows-mvp/INSTALL.md, "Download a release").
name: alfred-desktop
on:
  push:
    paths: ["windows-mvp/**", ".github/workflows/alfred-desktop.yml"]
  pull_request:
    paths: ["windows-mvp/**", ".github/workflows/alfred-desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the installer as the GitHub release v<version> (version from windows-mvp/jarvis/__init__.py)"
        type: boolean
        default: false
      notes:
        description: "Optional text added to the end of the release notes"
        type: string
        required: false
        default: ""
permissions:
  contents: read  # only the release job may write (it creates the release)
env:
  PYTHON_VERSION: "3.12.10"  # the test spec (windows-mvp/TESTING.md)
  NODE_VERSION: "22.23.3"  # same as windows-mvp.yml and packaging/fetch_node.ps1 (the bundled node.exe)
  # Build tools: PyInstaller in packaging/requirements-build.txt, Inno Setup in packaging/fetch_innosetup.ps1.
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows-mvp
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            windows-mvp/requirements.lock.txt
            windows-mvp/packaging/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: windows-mvp/telegram/package-lock.json
      - name: Install the locked packages and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r packaging/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip list
      - name: Build dist\Alfred (PyInstaller, Node.js, Telegram bridge)
        run: ./packaging/build.ps1
      - name: Self-test the built app
        run: ./dist/Alfred/alfred-cli.exe --selftest
      - name: Get the pinned Inno Setup (fetch_innosetup.ps1, never the runner's own)
        run: ./packaging/fetch_innosetup.ps1
      - name: Compile the installer
        run: ./packaging/installer.ps1 -Iscc build\innosetup\ISCC.exe
      - name: Install silently, self-test the installed copy, uninstall
        run: ./packaging/check_installer.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-Setup
          path: windows-mvp/dist/Alfred-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alfred-build-logs
          path: |
            windows-mvp/build/pyinstaller/**/warn-*.txt
            windows-mvp/build/pyinstaller/**/xref-*.html
            ${{ runner.temp }}/alfred-*.log
          if-no-files-found: ignore

  release:
    # Publishes the installer the job above built and checked, so it only runs when that job passed.
    needs: installer
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: alfred-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Alfred-Setup
          path: release
      - name: Checksum and release notes
        id: prep
        env:
          EXTRA_NOTES: ${{ inputs.notes }}
          DEMO_URL: https://dhruvavalluru.github.io/Jarvis-Hacks/
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' windows-mvp/jarvis/__init__.py)
          if [ -z "$version" ]; then echo "::error::No __version__ in windows-mvp/jarvis/__init__.py."; exit 1; fi
          setup="Alfred-Setup-$version.exe"
          if [ ! -f "release/$setup" ]; then
            echo "::error::The Alfred-Setup artifact has no $setup. It has:"; ls -l release; exit 1
          fi
          (cd release && sha256sum "$setup" > SHA256SUMS.txt)
          sha256=$(cut -d ' ' -f 1 release/SHA256SUMS.txt)
          # RELEASE_NOTES.md has {{VERSION}}, {{SHA256}} and {{COMMIT}} where these go.
          notes=$(cat windows-mvp/packaging/RELEASE_NOTES.md)
          notes=${notes//'{{VERSION}}'/"$version"}
          notes=${notes//'{{SHA256}}'/"$sha256"}
          notes=${notes//'{{COMMIT}}'/"$GITHUB_SHA"}
          # The notes link the web demo (pages.yml). Until it loads, leave that line out rather than link a 404.
          if ! curl -fsSL -o /dev/null --max-time 30 "$DEMO_URL"; then
            echo "::warning::The web demo ($DEMO_URL) doesn't load, so the release notes leave out the line about it."
            notes=$(grep -v -F "$DEMO_URL" <<< "$notes")
          fi
          if [ -n "$EXTRA_NOTES" ]; then notes=$(printf '%s\n\n## About this build\n\n%s' "$notes" "$EXTRA_NOTES"); fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          cat release/SHA256SUMS.txt
          {
            echo "version=$version"
            echo "setup=$setup"
          } >> "$GITHUB_OUTPUT"
      - name: Create the release (or replace its files)
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          SETUP: ${{ steps.prep.outputs.setup }}
        run: |
          tag="v$VERSION"
          files=("release/$SETUP" release/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            # Same version as an earlier release: replace its installer, checksum and notes rather than fail.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "Alfred $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            echo "::warning::Release $tag already existed, so its files were replaced with this build of $GITHUB_SHA. The tag stays where it was. For a new release, raise __version__ in windows-mvp/jarvis/__init__.py."
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Alfred $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          url=$(gh release view "$tag" --json url --jq .url)
          echo "Alfred $VERSION: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
