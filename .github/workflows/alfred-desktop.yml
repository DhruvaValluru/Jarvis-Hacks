# Builds Alfred's Windows installer and checks it works (see windows-mvp/INSTALL.md):
# PyInstaller app folder + Node + Telegram bridge, self-test, Inno Setup installer, silent install into a
# temporary folder, self-test of the installed copy, silent uninstall. The installer is uploaded as the
# "Alfred-Setup" artifact on the run's page. It is not code-signed (SmartScreen says "unknown publisher").
name: alfred-desktop
on:
  push:
    paths: ["windows-mvp/**", ".github/workflows/alfred-desktop.yml"]
  pull_request:
    paths: ["windows-mvp/**", ".github/workflows/alfred-desktop.yml"]
  workflow_dispatch:
env:
  PYTHON_VERSION: "3.12.10"  # the test spec (windows-mvp/TESTING.md)
  NODE_VERSION: "22.23.3"  # same as windows-mvp.yml and packaging/fetch_node.ps1 (the bundled node.exe)
  # Build tools: PyInstaller in packaging/requirements-build.txt, Inno Setup in packaging/fetch_innosetup.ps1.
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows-mvp
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            windows-mvp/requirements.lock.txt
            windows-mvp/packaging/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: windows-mvp/telegram/package-lock.json
      - name: Install the locked packages and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r packaging/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip list
      - name: Build dist\Alfred (PyInstaller, Node.js, Telegram bridge)
        run: ./packaging/build.ps1
      - name: Self-test the built app
        run: ./dist/Alfred/alfred-cli.exe --selftest
      - name: Get the pinned Inno Setup (fetch_innosetup.ps1, never the runner's own)
        run: ./packaging/fetch_innosetup.ps1
      - name: Compile the installer
        run: ./packaging/installer.ps1 -Iscc build\innosetup\ISCC.exe
      - name: Install silently, self-test the installed copy, uninstall
        run: ./packaging/check_installer.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-Setup
          path: windows-mvp/dist/Alfred-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alfred-build-logs
          path: |
            windows-mvp/build/pyinstaller/**/warn-*.txt
            windows-mvp/build/pyinstaller/**/xref-*.html
            ${{ runner.temp }}/alfred-*.log
          if-no-files-found: ignore
