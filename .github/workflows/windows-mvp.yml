# The reference run of the shared test spec (see windows-mvp/TESTING.md).
# Pinned runner image + Python + lock file, so a green run here means the same as a green test.bat anywhere.
name: windows-mvp
on:
  push:
    paths: ["windows-mvp/**", ".github/workflows/windows-mvp.yml"]
  pull_request:
    paths: ["windows-mvp/**", ".github/workflows/windows-mvp.yml"]
  workflow_dispatch:
jobs:
  spec-test:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows-mvp
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: windows-mvp/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"  # exact; same as alfred-desktop.yml and packaging/fetch_node.ps1
          cache: npm
          cache-dependency-path: windows-mvp/telegram/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~\.cache\huggingface
          key: whisper-base.en-v1
      - run: setup.bat /ci
      - run: npm ci
        working-directory: windows-mvp/telegram
      - run: test.bat
